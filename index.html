<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIMBOT EXTERNEL | MOSKO CHEATS</title>
<style>
*{box-sizing:border-box}
:root{--g:#00ff88;--bg:#030906}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;
background:var(--bg);color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
#matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;width:340px;height:340px;border-radius:50%;background:#00ff8822;filter:blur(90px);pointer-events:none}
.card{position:relative;z-index:1;width:100%;max-width:440px;padding:30px 24px;text-align:center;
background:linear-gradient(145deg,#0b1a12f2,#030906f7);border:1px solid #00ff8866;border-radius:24px;
box-shadow:0 0 35px #00ff8818,inset 0 0 25px #00ff8808;animation:appear .8s ease}
.avatar{width:116px;height:116px;object-fit:cover;object-position:center;border-radius:50%;
border:3px solid var(--g);padding:4px;background:#06150c;
box-shadow:0 0 15px #00ff88,0 0 36px #00ff8844;animation:pulse 3s infinite}
h1{font-size:clamp(25px,7vw,34px);margin:22px 0 12px;color:var(--g);
letter-spacing:1px;text-shadow:0 0 18px #00ff8866}
.creator{margin:0;color:#a6c6b3;font-size:12px;letter-spacing:2px}
.line{height:1px;margin:23px 0;background:linear-gradient(90deg,transparent,var(--g),transparent)}
.tag{display:inline-block;padding:11px 30px;border:1px solid #00ff88;border-radius:8px;
color:var(--g);letter-spacing:4px;font-size:13px;background:#00ff880d}
.status{margin:23px 0;color:#8ac6a5;font-size:10px;letter-spacing:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:9px;box-shadow:0 0 10px var(--g)}
.open{display:block;width:100%;padding:16px;border:0;border-radius:10px;background:var(--g);
color:#00170b;font-weight:900;font-size:15px;letter-spacing:2px;cursor:pointer;
box-shadow:0 0 22px #00ff8833;transition:.2s}
.open:hover{transform:translateY(-3px);box-shadow:0 0 32px #00ff8877;background:#6dffb4}
footer{margin-top:24px;color:#50745e;font-size:10px;letter-spacing:3px}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{50%{box-shadow:0 0 25px #00ff88,0 0 45px #00ff8844}}
</style>
