
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOSKO CHEATS</title>
<style>
*{box-sizing:border-box}
:root{--red:#ff2345;--bg:#080910;--panel:#131522}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;background:radial-gradient(ellipse at top,#45101e 0%,#15101b 38%,#07080d 100%);
 color:#fff;font-family:Arial,sans-serif;overflow-x:hidden
}
#particles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.card{
 position:relative;z-index:1;width:100%;max-width:420px;text-align:center;
 padding:28px 23px;background:rgba(15,16,27,.94);
 border:1px solid #43202e;border-radius:22px;
 box-shadow:0 0 35px #ff234522,0 20px 70px #0008;
 animation:appear .7s ease
}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.avatar{
 width:112px;height:112px;border-radius:50%;object-fit:cover;
 border:3px solid var(--red);box-shadow:0 0 24px #ff234577;
 margin:0 auto 16px;display:block
}
h1{margin:5px 0;color:var(--red);letter-spacing:2px;text-shadow:0 0 15px #ff234566}
.subtitle{color:#a9acbb;font-size:14px;line-height:1.6}
input,select,button{
 width:100%;padding:13px;margin-top:12px;border-radius:10px;
 font-size:15px
}
input{
 background:#090a12;color:white;border:1px solid #36384b;
 outline:none;text-align:center;direction:ltr
}
input:focus{border-color:var(--red);box-shadow:0 0 12px #ff234533}
button{border:0;background:var(--red);color:white;font-weight:bold;cursor:pointer;transition:.2s}
button:hover{filter:brightness(1.15);transform:translateY(-1px)}
select{background:#090a12;color:white;border:1px solid #36384b}
#message{min-height:22px;margin-top:12px;font-size:14px;line-height:1.5}
.error{color:#ff657b}.success{color:#5affbd}.info{color:#ffc66b}
.hidden{display:none!important}
.links{display:flex;gap:10px;margin-top:12px}
.links a{flex:1;text-decoration:none;color:white;padding:12px 8px;border-radius:10px;font-size:14px;font-weight:bold}
.youtube{background:#d71935}.telegram{background:#167db2}
.footer{font-size:11px;color:#73788c;margin-top:22px}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<main class="card">
  <div id="loginPage">
    <img class="avatar" src="https://fastupload.live/do.php?img=19591" alt="MOSKO profile">
    <h1>MOSKO CHEATS</h1>
    <p class="subtitle" id="subtitle">أدخل مفتاحك للمتابعة</p>

    <select id="language" aria-label="Language">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>

    <form id="keyForm">
      <input id="keyInput" type="text" autocomplete="off"
        placeholder="MOSKO-XXXXXXXXXXXX" maxlength="18" dir="ltr">
      <button id="submitBtn" type="submit">تحقق من المفتاح</button>
    </form>
    <div id="message" role="status"></div>
  </div>

  <div id="successPage" class="hidden">
    <img class="avatar" src="https://fastupload.live/do.php?img=19591" alt="MOSKO profile">
    <h1>MOSKO CHEATS</h1>
    <p class="subtitle" id="welcome"></p>
    <button id="happBtn">Add to Happ</button>
    <div class="links">
      <a class="youtube" href="https://youtube.com/@MOSKO_CHEATS" target="_blank" rel="noopener">YouTube</a>
      <a class="telegram" href="https://t.me/MOSKOCHEATS" target="_blank" rel="noopener">Telegram</a>
    </div>
  </div>
  <div class="footer">MOSKO CHEATS • KEY SYSTEM</div>
</main>

<script>
const API_URL = "https://mosko8773-cmd.github.io/aimbotbymosko/api.html";

/*
  ملاحظة:
  api.html على GitHub Pages صفحة ثابتة وليست API خلفية تلقائيًا.
  هذا الكود يحاول إرسال POST إليها؛ يجب أن يكون هناك endpoint فعلي
  يقبل الطلب ويرجع JSON حتى ينجح التحقق من المفاتيح.
*/
const HAPP_LINK = "PASTE_YOUR_COMPLETE_HAPP_LINK_HERE";

const translations = {
 ar:{
  subtitle:"أدخل مفتاحك للمتابعة",
  placeholder:"MOSKO-XXXXXXXXXXXX",
  submit:"تحقق من المفتاح",
  empty:"اكتب الكود أولاً",
  incomplete:"الكود مش كامل أو صيغته خاطئة",
  checking:"جارٍ التحقق من المفتاح...",
  wrong:"الكود خاطئ أو منتهي الصلاحية",
  offline:"تعذر الاتصال بالسيرفر. تحقق من إعدادات API.",
  welcome:"تم التحقق من المفتاح بنجاح!",
  happ:"إضافة إلى Happ"
 },
 en:{
  subtitle:"Enter your key to continue",
  placeholder:"MOSKO-XXXXXXXXXXXX",
  submit:"Verify key",
  empty:"Please enter a key first",
  incomplete:"The key is incomplete or has an invalid format",
  checking:"Checking your key...",
  wrong:"Invalid or expired key",
  offline:"Could not connect to the server. Check the API setup.",
  welcome:"Key verified successfully!",
  happ:"Add to Happ"
 },
 es:{
  subtitle:"Introduce tu clave para continuar",
  placeholder:"MOSKO-XXXXXXXXXXXX",
  submit:"Verificar clave",
  empty:"Introduce una clave primero",
  incomplete:"La clave está incompleta o tiene un formato incorrecto",
  checking:"Verificando la clave...",
  wrong:"Clave incorrecta o caducada",
  offline:"No se pudo conectar al servidor. Comprueba la API.",
  welcome:"¡Clave verificada correctamente!",
  happ:"Añadir a Happ"
 }
};

let lang="ar";
const $=id=>document.getElementById(id);
function msg(text,type="error"){
 $("message").className=type;
 $("message").textContent=text;
}
function setLanguage(value){
 lang=value;
 const t=translations[lang];
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("subtitle").textContent=t.subtitle;
 $("keyInput").placeholder=t.placeholder;
 $("submitBtn").textContent=t.submit;
 $("happBtn").textContent=t.happ;
 $("language").value=lang;
 msg("");
}
$("language").addEventListener("change",e=>setLanguage(e.target.value));

$("keyForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const t=translations[lang];
 const key=$("keyInput").value.trim().toUpperCase();

 if(!key){msg(t.empty);return}
 if(!/^MOSKO-[A-Z0-9]{12}$/.test(key)){
   msg(t.incomplete);return;
 }

 $("submitBtn").disabled=true;
 $("submitBtn").textContent=t.checking;
 msg(t.checking,"info");

 try{
   const response=await fetch(API_URL,{
     method:"POST",
     headers:{
       "Content-Type":"application/json",
       "Accept":"application/json"
     },
     body:JSON.stringify({key})
   });

   if(!response.ok) throw new Error("HTTP "+response.status);
   const data=await response.json();

   // لا نقبل المفتاح إلا إذا أكد السيرفر نجاح التحقق صراحةً.
   if(data.valid===true || data.success===true){
     $("loginPage").classList.add("hidden");
     $("successPage").classList.remove("hidden");
     $("welcome").textContent=t.welcome;
   }else{
     msg(data.message || t.wrong);
   }
 }catch(error){
   msg(t.offline);
 }finally{
   $("submitBtn").disabled=false;
   $("submitBtn").textContent=t.submit;
 }
});

$("happBtn").addEventListener("click",()=>{
 if(HAPP_LINK.startsWith("happ://")){
   window.location.href=HAPP_LINK;
 }else{
   alert("ضع رابط Happ الكامل داخل متغير HAPP_LINK في الكود.");
 }
});

/* تأثير الجسيمات */
const canvas=$("particles"),ctx=canvas.getContext("2d");
let particles=[];
function resize(){
 canvas.width=window.innerWidth;
 canvas.height=window.innerHeight;
 particles=Array.from({length:55},()=>({
   x:Math.random()*canvas.width,
   y:Math.random()*canvas.height,
   r:Math.random()*2+0.5,
   speed:Math.random()*0.6+0.2
 }));
}
function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for(const p of particles){
   p.y-=p.speed;
   if(p.y<0){p.y=canvas.height;p.x=Math.random()*canvas.width}
   ctx.beginPath();
   ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
   ctx.fillStyle="rgba(255,45,75,.65)";
   ctx.fill();
 }
 requestAnimationFrame(animate);
}
window.addEventListener("resize",resize);
resize();animate();
setLanguage("ar");
</script>
</body>
</html>
